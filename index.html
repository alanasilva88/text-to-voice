<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>VoiceText</title>
</head>

<body>
    <main>
        <h1>
            Vo<span>i</span>ce<span>T</span>ext
        </h1>
        <h3>
            Transforme texto em voz de forma simples!
        </h3>
        <p>Digite um texto ou envie um arquivo</p>

        <div id="content">
            <textarea id="text" placeholder="Digite aqui..."></textarea>

            <div>
                <label for="upload" id="label-file">Enviar arquivo</label>
                <input type="file" id="upload" accept=".txt" />
            </div>

            <div class="actions">
                <div class="action-box box1">
                    <p>
                        Selecione a voz:
                    </p>
                    <select id="voice"></select>
                </div>

                <div class="last-btn">
                    <div class="action-box">
                        <button id="listen-btn">
                            Ouvir Texto
                        </button>
                    </div>
                    
                    <div class="action-box">
                        <button id="download-btn">
                            Baixar Texto
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="./scripts.js"></script>

</html>
